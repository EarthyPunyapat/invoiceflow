name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d invoiceflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoiceflow_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/invoiceflow_test?schema=public
      NEXT_PUBLIC_APP_URL: https://ci.example.test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm run db:generate
      - name: Apply database migrations
        run: pnpm run db:deploy
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm test
      - name: Database and billing integration tests
        run: pnpm run test:integration
      - name: Build
        run: |
          export AUTH_SECRET="$(openssl rand -hex 32)"
          pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
